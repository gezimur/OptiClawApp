name: OptiClawApp
options:
  bundleIdPrefix: com.opticlaw
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  OptiClawApp:
    type: application
    platform: iOS
    sources:
      - OptiClawApp
    resources:
      - path: OptiClawApp/Resources/Fonts
        buildPhase: resources
    info:
      path: OptiClawApp/Info.plist
      properties:
        UIAppFonts:
          - PoppinsRegular.ttf
          - PoppinsMedium.ttf
          - PoppinsLight.ttf
          - PoppinsSemiBold.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: OptiClaw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opticlaw.app
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: OptiClawApp/Info.plist
